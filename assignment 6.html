<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center my-5">
        <div class="row w-100 shadow rounded overflow-hidden" style="max-width: 800px;">
            <div class="col-12 col-md-5 bg-primary d-flex justify-content-center align-items-center flex-column text-white p-4 text-center">
                <img src="images/1.2.png" alt="" style="max-height: 180px;" class="img-fluid mb-3 rounded-circle">
                <h3>Welcome Back</h3>
                <p>Signup to learn more.</p>
            </div>
            <div class="col-12 col-md-7 p-4">
                <h4 class="text-center mb-4 text-primary">LOGIN</h4>
                <form>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter email">
            </div>
            <div class="mb-3">
                <a href="#" class="small">Forgot password?</a>
            </div>
            <button class="btn btn-primary w-100 mb-3">Login</button>
            <div class="text-center mb-3">
             <small>New to our platform? <a href="#">Signup</a></small>
            </div>
            <div class="text-center mb-2">Or</div>
            <div class="d-flex gap-2">
            <button class="btn btn-primary w-50">Facebook</button>
            <button class="btn btn-danger w-50">Google</button>    
            </div>
            </form>    
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
