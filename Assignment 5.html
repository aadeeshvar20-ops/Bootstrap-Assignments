<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Student Information Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-5">Bootstrap Buttons Showcase</h1>
        <div class="mb-5">
            <h4 class="mb-3">Button Colors</h4>
            <div class="row g-3">
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-primary w-100">Primary</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-secondary w-100">Secondary</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-success w-100">Success</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-danger w-100">Danger</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-warning w-100">Warning</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-info w-100">Info</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-light w-100">Light</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-dark w-100">Dark</button></div>
            </div>
        </div>
        <div class="mb-5">
        <h4 class="mb-3">Button Colors</h4>
        <div class="row g-3">
            <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-outline-primary w-100">Primary</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-outline-secondary w-100">Secondary</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-outline-success w-100">Success</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-outline-danger w-100">Danger</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-outline-warning w-100">Warning</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-outline-info w-100">Info</button></div>
                <div class="col-lg-3 col-md-4 col-6"><button class="btn btn-outline-dark w-100">Dark</button></div>
            </div>
        </div>
        <div class="mb-5">
            <h4 class="mb-3">Button Groups</h4>
            <div class="btn-group mx-2">
                <button class="btn btn-primary">Left</button>
                <button class="btn btn-primary">Middle</button>
                <button class="btn btn-primary">Right</button>
            </div>
            <div class="btn-group">
                <button class="btn btn-success">Yes</button>
                <button class="btn btn-warning">Maybe</button>
                <button class="btn btn-danger">No</button>
            </div>
        </div>
        <div class="mb-5">
            <h4 class="mb-3">Toggle Buttons (Multiple Select)</h4>
            <input type="checkbox" class="btn-check" id="toggle1">
            <label class="btn btn-outline-primary me2" for="toggle1">Option 1</label>
            <input type="checkbox" class="btn-check" id="toggle2">
            <label class=" btn btn-outline-success me2" for="toggle2">Option 2</label>
            <input type="checkbox" class="btn-check" id="toggle3">
            <label class="btn btn-outline-danger" for="toggle3">Option 3</label>
        </div>
        <div class="mb-5">
            <h4 class="mb-3">Radio Button (Single Select)</h4>
            <input type="radio" class="btn-check" name="options" id="radio1" checked>
            <label class="btn btn-outline-primary me2" for="radio1">Option 1</label>
            <input type="radio" class="btn-check" name="options" id="radio2">
            <label class=" btn btn-outline-success me2" for="radio2">Option 2</label>
            <input type="radio" class="btn-check" name="options" id="radio3">
            <label class="btn btn-outline-danger" for="radio3">Option 3</label>
        </div>
        <div class="mb-5">
            <h4 class="mb-3">Button Toolbar</h4>
            <div class="btn-toolbar gap-2">
             <div class="btn-group">
                <button class="btn btn-outline-primary">1</button>
                <button class="btn btn-outline-primary">2</button>
                <button class="btn btn-outline-primary">3</button>
             </div>
             <div class="btn-group">
                <button class="btn btn-outline-success">A</button>
                <button class="btn btn-outline-success">B</button>
             </div>
            </div>
        </div>
        <div class="mb-5">
            <h4 class="mb-3">Button Sizes</h4>
            <button class="btn btn-primary btn-lg me-2">Large</button>
            <button class="btn btn-success  me-2">Default</button>
            <button class="btn btn-danger btn-sm">Small</button>
        </div>
        <div class="mb-5">
            <h4 class="mb-3">Full Width Buttons</h4>
            <div class="row g-3">
                <div class="col-md-6"><button class="btn btn-primary w-100">Full Width</button></div>
                <div class="col-md-6"><button class="btn btn-success w-100">Full Width</button></div>
            </div>
        </div>
        <h4 class="mb-2">States</h4>
        <button class="btn btn-primary active me-2">Active</button>
        <button class="btn btn-secondary" disabled>Disabled</button>
    </div>  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
